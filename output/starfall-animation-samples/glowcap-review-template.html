<div id="glowcap-hop-review">
  <style>
    #glowcap-hop-review .hop-comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
    #glowcap-hop-review .hop-view { min-width: 0; }
    #glowcap-hop-review .hop-label { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; }
    #glowcap-hop-review .hop-canvas { display: block; width: 100%; aspect-ratio: 8 / 7; }
    #glowcap-hop-review .hop-timeline { margin-top: 16px; }
    #glowcap-hop-review .hop-poses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    #glowcap-hop-review .hop-pose { min-width: 0; margin: 0; }
    #glowcap-hop-review .hop-pose canvas { display: block; width: 100%; aspect-ratio: 1; }
    #glowcap-hop-review .hop-pose figcaption { margin-top: 8px; }
    #glowcap-hop-review .hop-palette { position: absolute; visibility: hidden; pointer-events: none; }
    @media (max-width: 560px) {
      #glowcap-hop-review .hop-comparison { grid-template-columns: 1fr; }
      #glowcap-hop-review .hop-poses { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
  <h3 data-title>Glowcap · pose study</h3>
  <div class="viz-controls">
    <label class="form-label">Speed
      <select class="form-select" data-speed>
        <option value="0.5">Half speed</option>
        <option value="1" selected>Normal</option>
      </select>
    </label>
    <label class="form-label">Size
      <select class="form-select" data-zoom>
        <option value="1">Game size</option>
        <option value="2" selected>2× game size</option>
      </select>
    </label>
  </div>
  <div class="hop-comparison">
    <section class="hop-view" aria-labelledby="glowcap-current-label">
      <div class="hop-label"><span id="glowcap-current-label" data-before-label>Current idle</span><span class="text-small tabular-nums" data-before-frame></span></div>
      <canvas class="hop-canvas" data-before role="img" aria-label="Current idle at its existing game timing and registration">Current idle</canvas>
    </section>
    <section class="hop-view" aria-labelledby="glowcap-study-label">
      <div class="hop-label"><span id="glowcap-study-label" data-after-label>Grounded spring study</span><span class="text-small tabular-nums" data-after-frame></span></div>
      <canvas class="hop-canvas" data-after role="img" aria-label="Grounded spring study with separately drawn poses">Grounded spring study</canvas>
    </section>
  </div>
  <div class="viz-row">
    <button class="btn btn-primary" type="button" data-play>Pause</button>
    <button class="btn" type="button" data-step>Next frame</button>
    <span class="text-small" data-pose-name></span>
  </div>
  <label class="form-label hop-timeline">Loop position <span class="tabular-nums" data-phase>0%</span>
    <input class="form-range" type="range" min="0" max="999" value="0" data-scrub aria-label="New study loop position">
  </label>
  <div class="hop-poses" data-key-poses role="group" aria-label="Key poses from the new study"></div>
  <span class="sr-only" data-status aria-live="polite"></span>
  <span class="hop-palette" aria-hidden="true" data-palette></span>
  <script type="application/json" data-review-data>__REVIEW_DATA__</script>
  <script>
    (() => {
      const root = document.getElementById('glowcap-hop-review');
      const data = JSON.parse(root.querySelector('[data-review-data]').textContent);
      const find = (name) => root.querySelector(`[data-${name}]`);
      const controls = Object.fromEntries(['speed', 'zoom', 'play', 'step', 'scrub', 'phase', 'pose-name', 'key-poses', 'status', 'palette'].map((name) => [name, find(name)]));
      const canvases = [find('before'), find('after')];
      const labels = [find('before-frame'), find('after-frame')];
      const beforeLabel = String(data.beforeLabel || data.before.label || 'Current idle');
      const afterLabel = String(data.afterLabel || data.after.label || 'Grounded spring study');
      find('title').textContent = typeof data.title === 'string' ? data.title : 'Glowcap · pose study';
      find('title').hidden = !find('title').textContent;
      find('before-label').textContent = beforeLabel;
      find('after-label').textContent = afterLabel;
      canvases[0].setAttribute('aria-label', `${beforeLabel}, existing game timing and registration`);
      canvases[1].setAttribute('aria-label', `${afterLabel}, independently drawn poses`);
      controls.scrub.setAttribute('aria-label', `${afterLabel} loop position`);
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const defaults = { speed: 1, zoom: 2, playing: !reducedMotion.matches };
      const images = {};
      const thumbnailViews = [];
      const drawCache = new WeakMap();
      let state = { ...defaults };
      let elapsed = 0;
      let loaded = false;
      let colors = null;
      let animationRequest = 0;
      let lastTick = 0;
      let lastPaint = 0;
      let visible = true;

      const timeline = (clip) => {
        const holds = clip.frames.map((frame, index) => Math.max(1, Number(clip.holds && clip.holds[index]) || 1));
        const total = holds.reduce((sum, value) => sum + value, 0);
        let cursor = 0;
        const starts = holds.map((hold) => {
          const start = cursor / total * clip.duration;
          cursor += hold;
          return start;
        });
        return { starts, duration: Number(clip.duration) };
      };
      const beforeTimeline = timeline(data.before);
      const afterTimeline = timeline(data.after);
      const positiveRemainder = (value, divisor) => ((value % divisor) + divisor) % divisor;
      const frameAt = (timing, seconds) => {
        const phaseSeconds = positiveRemainder(seconds, timing.duration);
        for (let index = timing.starts.length - 1; index >= 0; index -= 1) {
          if (phaseSeconds + 1e-9 >= timing.starts[index]) return index;
        }
        return 0;
      };
      const frameStart = (index) => afterTimeline.starts[Math.max(0, Math.min(afterTimeline.starts.length - 1, index))];
      const phaseName = (index) => String(data.phaseNames && data.phaseNames[index] || `Frame ${index + 1}`);
      const visibleRect = (frame) => frame.visible || { left: 0, top: 0, right: frame.w, bottom: frame.h };

      function syncControls() {
        controls.speed.value = String(state.speed);
        controls.zoom.value = String(state.zoom);
        controls.play.textContent = state.playing ? 'Pause' : 'Play';
        controls.play.setAttribute('aria-label', state.playing ? 'Pause both animations' : 'Play both animations');
        controls.play.setAttribute('aria-pressed', String(state.playing));
      }

      function save() {
        if (!window.openai || typeof window.openai.setWidgetState !== 'function') return;
        const modelContent = { speed: state.speed };
        if (!state.playing) modelContent.selectedFrame = frameAt(afterTimeline, elapsed);
        window.openai.setWidgetState({
          modelContent,
          privateContent: { zoom: state.zoom, playing: state.playing, elapsedSeconds: elapsed }
        }).catch(() => {});
      }

      function applySaved(saved) {
        const model = saved && saved.modelContent || {};
        const ui = saved && saved.privateContent || {};
        state = { ...defaults };
        if ([0.5, 1].includes(model.speed)) state.speed = model.speed;
        if ([1, 2].includes(ui.zoom)) state.zoom = ui.zoom;
        if (typeof ui.playing === 'boolean') state.playing = ui.playing;
        const hasSavedElapsed = Number.isFinite(ui.elapsedSeconds) && ui.elapsedSeconds >= 0;
        elapsed = hasSavedElapsed ? ui.elapsedSeconds : 0;
        if (!hasSavedElapsed && Number.isInteger(model.selectedFrame) && model.selectedFrame >= 0 && model.selectedFrame < data.after.frames.length) {
          elapsed = frameStart(model.selectedFrame) + 1e-7;
        }
        lastTick = 0;
        syncControls();
        draw(true);
        drawThumbnails();
        schedule();
      }

      function resolveColor(name) {
        controls.palette.style.color = `var(--${name})`;
        return getComputedStyle(controls.palette).color;
      }

      function updateColors() {
        colors = { scene: resolveColor('background'), ground: resolveColor('muted'), line: resolveColor('border') };
        draw(true);
        drawThumbnails();
      }

      function paint(canvas, clip, index, width, height, groundY, zoom, force) {
        const displayWidth = Math.max(1, canvas.clientWidth);
        const pixelRatio = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
        const targetWidth = Math.round(displayWidth * pixelRatio);
        const targetHeight = Math.round(displayWidth * height / width * pixelRatio);
        const signature = `${index}:${zoom}:${targetWidth}:${targetHeight}:${colors.scene}:${colors.ground}:${colors.line}`;
        if (!force && drawCache.get(canvas) === signature) return;
        drawCache.set(canvas, signature);
        if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
          canvas.width = targetWidth;
          canvas.height = targetHeight;
        }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(targetWidth / width, 0, 0, targetHeight / height, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = colors.scene;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = colors.ground;
        ctx.fillRect(0, groundY, width, height - groundY);
        ctx.strokeStyle = colors.line;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, groundY + 0.5);
        ctx.lineTo(width, groundY + 0.5);
        ctx.stroke();
        const frame = clip.frames[index];
        const scale = Number(clip.scale) * zoom;
        const drawX = width / 2 - Number(frame.rootX) * scale;
        const drawY = groundY - Number(frame.rootY) * scale;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(images[clip.image], frame.x, frame.y, frame.w, frame.h, drawX, drawY, frame.w * scale, frame.h * scale);
        canvas.dataset.frame = String(index);
        const visible = visibleRect(frame);
        canvas.dataset.bounds = JSON.stringify({
          left: drawX + visible.left * scale,
          top: drawY + visible.top * scale,
          right: drawX + visible.right * scale,
          bottom: drawY + visible.bottom * scale
        });
      }

      function draw(force = false) {
        if (!loaded || !colors) return;
        const beforeIndex = frameAt(beforeTimeline, elapsed);
        const afterIndex = frameAt(afterTimeline, elapsed);
        paint(canvases[0], data.before, beforeIndex, 320, 280, 250, state.zoom, force);
        paint(canvases[1], data.after, afterIndex, 320, 280, 250, state.zoom, force);
        labels[0].textContent = `${beforeIndex + 1} / ${data.before.frames.length}`;
        labels[1].textContent = `${afterIndex + 1} / ${data.after.frames.length}`;
        controls['pose-name'].textContent = phaseName(afterIndex);
        const phase = positiveRemainder(elapsed, afterTimeline.duration) / afterTimeline.duration;
        controls.scrub.value = String(Math.min(999, Math.floor(phase * 1000)));
        controls.scrub.setAttribute('aria-valuetext', `${Math.round(phase * 100)} percent, ${phaseName(afterIndex)}, frame ${afterIndex + 1}`);
        controls.phase.textContent = `${Math.round(phase * 100)}%`;
        root.dataset.elapsed = String(elapsed);
      }

      function drawThumbnails() {
        if (!loaded || !colors) return;
        let thumbnailZoom = Number.POSITIVE_INFINITY;
        data.after.frames.forEach((frame) => {
          const visible = visibleRect(frame);
          const left = Math.max(0, Number(frame.rootX) - visible.left) * data.after.scale;
          const right = Math.max(0, visible.right - Number(frame.rootX)) * data.after.scale;
          const above = Math.max(0, Number(frame.rootY) - visible.top) * data.after.scale;
          const below = Math.max(0, visible.bottom - Number(frame.rootY)) * data.after.scale;
          if (left) thumbnailZoom = Math.min(thumbnailZoom, 72 / left);
          if (right) thumbnailZoom = Math.min(thumbnailZoom, 72 / right);
          if (above) thumbnailZoom = Math.min(thumbnailZoom, 132 / above);
          if (below) thumbnailZoom = Math.min(thumbnailZoom, 8 / below);
        });
        if (!Number.isFinite(thumbnailZoom)) thumbnailZoom = 2;
        thumbnailViews.forEach((view) => paint(view.canvas, data.after, view.frame, 160, 160, 144, thumbnailZoom, true));
      }

      function schedule() {
        if (animationRequest) cancelAnimationFrame(animationRequest);
        animationRequest = 0;
        if (!loaded || !state.playing || document.hidden || !visible || !root.isConnected) {
          lastTick = 0;
          return;
        }
        animationRequest = requestAnimationFrame(tick);
      }

      function tick(now) {
        animationRequest = 0;
        if (!state.playing || document.hidden || !visible || !root.isConnected) {
          lastTick = 0;
          return;
        }
        if (lastTick) elapsed += Math.max(0, now - lastTick) / 1000 * state.speed;
        lastTick = now;
        if (now - lastPaint >= 30) {
          draw();
          lastPaint = now;
        }
        animationRequest = requestAnimationFrame(tick);
      }

      function changed(announce) {
        lastTick = 0;
        syncControls();
        draw(true);
        schedule();
        if (announce) controls.status.textContent = `${state.playing ? 'Playing' : 'Paused'}. ${phaseName(frameAt(afterTimeline, elapsed))}.`;
        save();
      }

      controls.speed.addEventListener('change', () => { state.speed = Number(controls.speed.value); changed(false); });
      controls.zoom.addEventListener('change', () => { state.zoom = Number(controls.zoom.value); changed(false); });
      controls.play.addEventListener('click', () => { state.playing = !state.playing; changed(true); });
      controls.step.addEventListener('click', () => {
        state.playing = false;
        const current = frameAt(afterTimeline, elapsed);
        const next = (current + 1) % data.after.frames.length;
        const cycle = Math.floor(elapsed / afterTimeline.duration) + (next === 0 ? 1 : 0);
        elapsed = cycle * afterTimeline.duration + frameStart(next) + 1e-7;
        changed(true);
      });
      controls.scrub.addEventListener('input', () => {
        state.playing = false;
        const cycle = Math.floor(elapsed / afterTimeline.duration);
        elapsed = (cycle + Number(controls.scrub.value) / 1000) * afterTimeline.duration;
        syncControls();
        draw(true);
        schedule();
      });
      controls.scrub.addEventListener('change', () => changed(true));
      window.addEventListener('openai:set_globals', (event) => {
        const globals = event.detail && event.detail.globals;
        if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) applySaved(globals.widgetState);
      });
      document.addEventListener('visibilitychange', schedule);
      reducedMotion.addEventListener('change', (event) => {
        if (event.matches) {
          state.playing = false;
          syncControls();
          schedule();
        }
      });
      new ResizeObserver(() => { draw(true); drawThumbnails(); }).observe(root);
      new MutationObserver(updateColors).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
      if (typeof IntersectionObserver === 'function') {
        new IntersectionObserver((entries) => {
          visible = entries[0].isIntersecting;
          schedule();
        }).observe(root);
      }
      (data.keyPoses || []).slice(0, 4).forEach((pose) => {
        const frame = Math.max(0, Math.min(data.after.frames.length - 1, Math.floor(Number(pose.frame) || 0)));
        const figure = document.createElement('figure');
        figure.className = 'hop-pose';
        const canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', `${pose.label}, ${afterLabel}, frame ${frame + 1}`);
        const caption = document.createElement('figcaption');
        caption.className = 'text-small';
        caption.textContent = String(pose.label || phaseName(frame));
        figure.append(canvas, caption);
        controls['key-poses'].append(figure);
        thumbnailViews.push({ canvas, frame });
      });
      applySaved(window.openai && window.openai.widgetState);
      updateColors();
      Promise.all(Object.entries(data.images).map(([id, src]) => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => { images[id] = image; resolve(); };
        image.onerror = reject;
        image.src = src;
      }))).then(() => {
        loaded = true;
        root.dataset.ready = 'true';
        draw(true);
        drawThumbnails();
        schedule();
      }).catch(() => {
        state.playing = false;
        syncControls();
        controls.status.classList.remove('sr-only');
        controls.status.setAttribute('role', 'alert');
        controls.status.textContent = 'The animation images could not load.';
      });
    })();
  </script>
</div>
