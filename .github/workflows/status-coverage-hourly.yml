name: Hourly project and tool status
run-name: ${{ inputs.fallback_slot && format('Hourly status fallback {0}', inputs.fallback_slot) || 'Hourly project and tool status' }}

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      fallback_slot:
        description: UTC hour used by the AWS fallback dispatcher
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hourly-project-status
  queue: max

jobs:
  cadence:
    if: github.ref == 'refs/heads/main' && github.repository_id == '698339955'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      covered: ${{ steps.cadence.outputs.covered }}
    steps:
      - name: Check whether this UTC hour already has a report
        id: cadence
        if: github.event_name == 'schedule' || inputs.fallback_slot != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          hour=$(date -u '+%Y-%m-%dT%H:00:00Z')
          since=$(date -u -d "$hour -1 hour" '+%Y-%m-%dT%H:00:00Z')
          actions="repos/$GITHUB_REPOSITORY/actions"
          runs_path="$actions/workflows/status-coverage-hourly.yml/runs"
          # Find the successful publish step even if the suite reported a failed fixture.
          if ! runs=$(gh api --method GET "$runs_path" -f branch=main -f status=completed \
            -f "created=>=$since" -F per_page=20 | jq -r --arg hour "$hour" \
            '.workflow_runs | arrays | .[] | select(.updated_at >= $hour) | .id'); then
            echo "Could not read recent runs. Continuing with the browser checks."
            exit 0
          fi
          for run in $runs; do
            if ! jobs=$(gh api "$actions/runs/$run/jobs?filter=latest&per_page=20"); then
              echo "Could not read recent job results. Continuing with the browser checks."
              exit 0
            fi
            if jq -e --arg hour "$hour" '
              .jobs as $jobs
              | any($jobs[]; .name == "check" and any(.steps[];
                  .name == "Run the catalog browser checks" and .conclusion == "success"
                  and (.completed_at | type == "string")
                  and (.completed_at[:13] == $hour[:13])))
                and any($jobs[]; .name == "publish / publish" and any(.steps[];
                  .name == "Publish the browser outcomes" and .conclusion == "success"))
            ' <<< "$jobs" > /dev/null; then
              echo "covered=true" >> "$GITHUB_OUTPUT"
              echo "A browser report already covered the UTC hour starting $hour."
              exit 0
            fi
          done
          echo "No published browser report for $hour. Continuing with the browser checks."

  check:
    needs: cadence
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.repository_id == '698339955' && needs.cadence.outputs.covered != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      release: ${{ steps.release.outputs.sha }}
      report: ${{ steps.check.outputs.report }}
      check_failed: ${{ steps.check.outputs.failed }}
    steps:
      - name: Select the last successful Vercel production release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_rows=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=10" --jq '.[] | select(.creator.login == "vercel[bot]" and .environment == "Production") | [.id, .sha] | @tsv')
          while IFS=$'\t' read -r deployment sha; do
            [[ "$deployment" =~ ^[0-9]+$ && "$sha" =~ ^[a-f0-9]{40}$ ]] || continue
            result=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=1" --jq '.[0] | select(.creator.login == "vercel[bot]" and .state == "success") | .environment_url')
            if [[ "$result" =~ ^https://website-[a-z0-9]+-daniel-shorts-projects\.vercel\.app/?$ ]]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "Testing production source $sha"
              exit 0
            fi
          done <<< "$deployment_rows"
          echo "Could not verify a successful Vercel production deployment." >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Check out the report transport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: report-transport
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/status-report-public.pem
            /build/status-report-transport.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run the catalog browser checks
        id: check
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/catalog-report.json"
          result=0
          node tests/status-coverage/run.cjs --site-root "$GITHUB_WORKSPACE" --report "$report" || result=$?
          [[ "$result" == 0 || "$result" == 1 ]] && [[ -s "$report" ]] || exit 2
          jq -ce '{schemaVersion, environment, checkedAt, checks: [.checks[] | {id, status, method}]}' "$report" > "$RUNNER_TEMP/catalog-safe.json"
          transport="$GITHUB_WORKSPACE/report-transport"
          sealed=$(node "$transport/build/status-report-transport.cjs" seal "$RUNNER_TEMP/catalog-safe.json" "$transport/.github/status-report-public.pem")
          printf 'report=%s\nfailed=%s\n' "$sealed" "$result" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.report != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/status-report-publish.yml
    secrets:
      report_key: ${{ secrets.AWS_STATUS_REPORT_PRIVATE_KEY }}
    with:
      release: ${{ needs.check.outputs.release }}
      report: ${{ needs.check.outputs.report }}
      check_failed: ${{ needs.check.outputs.check_failed == '1' }}
