name: Six-hour System Status checks
run-name: ${{ inputs.fallback_slot && format('Six-hour System Status {0}', inputs.fallback_slot) || 'Six-hour System Status checks' }}

# The Ohio dispatcher runs at 00:47, 06:47, 12:47 and 18:47 UTC.
on:
  workflow_dispatch:
    inputs:
      fallback_slot:
        description: UTC six-hour cycle start used by the AWS dispatcher
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hourly-project-status
  queue: max

jobs:
  cadence:
    if: github.ref == 'refs/heads/main' && github.repository_id == '698339955'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      start: ${{ steps.cadence.outputs.start }}
      end: ${{ steps.cadence.outputs.end }}
    steps:
      - name: Verify the dispatch belongs to the current six-hour UTC cycle
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_SLOT: ${{ inputs.fallback_slot }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          start_epoch=$((now / 21600 * 21600))
          start=$(date -u -d "@$start_epoch" '+%Y-%m-%dT%H:%M:%SZ')
          end=$(date -u -d "@$((start_epoch + 21600))" '+%Y-%m-%dT%H:%M:%SZ')
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" |
            jq -er '.created_at | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))')
          if [[ "$created" < "$start" || ! "$created" < "$end" || (-n "$FALLBACK_SLOT" && "$FALLBACK_SLOT" != "$start") ]]; then
            echo "Dispatch is outside the current six-hour UTC cycle. Skipping the browser checks."
            exit 0
          fi
          printf 'start=%s\nend=%s\n' "$start" "$end" >> "$GITHUB_OUTPUT"

  check:
    needs: cadence
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.repository_id == '698339955' && needs.cadence.outputs.start != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      release: ${{ steps.release.outputs.sha }}
      report: ${{ steps.check.outputs.report }}
      check_failed: ${{ steps.check.outputs.failed }}
    steps:
      - name: Select the last successful Vercel production release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_rows=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=10" --jq '.[] | select(.creator.login == "vercel[bot]" and .environment == "Production") | [.id, .sha] | @tsv')
          while IFS=$'\t' read -r deployment sha; do
            [[ "$deployment" =~ ^[0-9]+$ && "$sha" =~ ^[a-f0-9]{40}$ ]] || continue
            result=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=1" --jq '.[0] | select(.creator.login == "vercel[bot]" and .state == "success") | .environment_url')
            if [[ "$result" =~ ^https://website-[a-z0-9]+-daniel-shorts-projects\.vercel\.app/?$ ]]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "Testing production source $sha"
              exit 0
            fi
          done <<< "$deployment_rows"
          echo "Could not verify a successful Vercel production deployment." >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Check out the report transport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: report-transport
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/status-report-public.pem
            /build/status-report-transport.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check for an earlier browser execution in this cycle
        id: cycle
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_START: ${{ needs.cadence.outputs.start }}
          CYCLE_END: ${{ needs.cadence.outputs.end }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" < "$CYCLE_END" ]]; then
            echo "The six-hour UTC cycle has ended. Skipping the browser checks."
            exit 0
          fi

          actions="repos/$GITHUB_REPOSITORY/actions"
          runs=$(gh api --method GET --paginate "$actions/workflows/status-coverage-hourly.yml/runs" \
            -f branch=main -f "created=>=$CYCLE_START" -F per_page=100 | jq -esr '
              if length > 0 and all(.[]; (.workflow_runs | type) == "array"
                  and all(.workflow_runs[]; (.id | type) == "number"))
              then .[].workflow_runs[].id
              else error("Could not verify recent workflow runs")
              end
            ')
          if ! grep -Fxq "$GITHUB_RUN_ID" <<< "$runs"; then
            echo "Could not verify the running workflow in the recent history." >&2
            exit 1
          fi

          # Inspect all attempts, including this run's earlier attempts and canceled jobs.
          for run in $runs; do
            [[ "$run" =~ ^[0-9]+$ ]] || exit 1
            started=$(gh api --paginate "$actions/runs/$run/jobs?filter=all&per_page=100" |
              jq -sr --arg start "$CYCLE_START" --arg end "$CYCLE_END" '
                if length > 0 and all(.[]; (.jobs | type) == "array")
                then any(.[].jobs[] | select(.name == "check") | .steps[]?;
                  .name == "Run the catalog browser checks" and .conclusion != "skipped"
                  and (.started_at | type == "string") and .started_at >= $start and .started_at < $end)
                else error("Could not verify recent browser check attempts")
                end
              ')
            if [[ "$started" == true ]]; then
              echo "The browser checks already began in the six-hour UTC cycle starting $CYCLE_START."
              exit 0
            fi
          done
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Run the catalog browser checks
        id: check
        if: steps.cycle.outputs.allowed == 'true'
        env:
          CYCLE_END: ${{ needs.cadence.outputs.end }}
        shell: bash
        run: |
          set -euo pipefail
          # Allow the job's full 15-minute time budget before the next cycle.
          if (( $(date -u +%s) + 900 >= $(date -u -d "$CYCLE_END" +%s) )); then
            echo "Too little time remains in this six-hour cycle to measure it."
            exit 0
          fi
          report="$RUNNER_TEMP/catalog-report.json"
          result=0
          node tests/status-coverage/run.cjs --site-root "$GITHUB_WORKSPACE" --report "$report" || result=$?
          [[ "$result" == 0 || "$result" == 1 ]] && [[ -s "$report" ]] || exit 2
          jq -ce '
            {schemaVersion, environment, checkedAt, checks: [
              .checks[] | .reasonCode as $reason | {id, status, method} +
              (if (.status == "fail" and ($reason | type) == "string" and (["r", "t", "m", "e"] | index($reason)) != null)
                or (.status == "unknown" and $reason == "n")
               then {reasonCode: $reason} else {} end)
            ]}
          ' "$report" > "$RUNNER_TEMP/catalog-safe.json"
          transport="$GITHUB_WORKSPACE/report-transport"
          sealed=$(node "$transport/build/status-report-transport.cjs" seal "$RUNNER_TEMP/catalog-safe.json" "$transport/.github/status-report-public.pem")
          printf 'report=%s\nfailed=%s\n' "$sealed" "$result" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.report != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/status-report-publish.yml
    secrets:
      report_key: ${{ secrets.AWS_STATUS_REPORT_PRIVATE_KEY }}
    with:
      release: ${{ needs.check.outputs.release }}
      report: ${{ needs.check.outputs.report }}
      check_failed: ${{ needs.check.outputs.check_failed == '1' }}
