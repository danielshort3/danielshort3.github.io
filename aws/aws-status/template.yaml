          import logging
          import os
          import re
          from datetime import date, datetime, time, timedelta, timezone

          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          REGION = "us-east-2"
          MAX_CHECKS = 70
          MAX_AGE = timedelta(days=90)
          HOUR = timedelta(hours=1)
          CATALOG_HISTORY_PREFIX = "report#"
          SOURCES = ("production", "browser", "local")
          STATES = {"operational", "degraded", "outage", "unknown"}
          HISTORY_CODES = {"operational": "o", "degraded": "d", "outage": "x", "unknown": "u"}
          RETRYABLE_WRITES = {
              "ConditionalCheckFailedException", "InternalServerError", "ProvisionedThroughputExceededException",
              "RequestLimitExceeded", "ThrottlingException",
          }
          FIELDS = {"id", "state", "lastChecked", "source", "expiresAt"}
          ID_PATTERN = re.compile(r"(?:tool:[a-z0-9][a-z0-9-]{0,63}|(?:project|game):[A-Za-z0-9][A-Za-z0-9_-]{0,63})")
          TIME_PATTERN = re.compile(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?(?:Z|\+00:00)")
          LOGGER = logging.getLogger(__name__)
          TABLE = boto3.resource("dynamodb", region_name=REGION, config=Config(
              connect_timeout=1, read_timeout=2, retries={"total_max_attempts": 1}
          )).Table(os.environ["HISTORY_TABLE"])


          def parse_time(value):
              if not isinstance(value, str) or not TIME_PATTERN.fullmatch(value):
                  raise ValueError("Expected an ISO UTC timestamp")
              return datetime.fromisoformat(value)


          def iso(value):
              return value.astimezone(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")


          def mountain_midnight(day):
              march = date(day.year, 3, 1)
              november = date(day.year, 11, 1)
              spring = march + timedelta(days=(6 - march.weekday()) % 7 + 7)
              fall = november + timedelta(days=(6 - november.weekday()) % 7)
              return datetime.combine(day, time(6 if spring < day <= fall else 7), timezone.utc)


          def validate(event, now, browser_ci):
              if not isinstance(event, dict) or set(event) != {"checks"}:
                  raise ValueError("Invalid catalog report")
              checks = event["checks"]
              if not isinstance(checks, list) or not 1 <= len(checks) <= MAX_CHECKS:
                  raise ValueError("Invalid number of checks")
              seen = set()
              groups = {}
              max_age = timedelta(hours=3) if browser_ci else MAX_AGE
              for check in checks:
                  if not isinstance(check, dict) or set(check) != FIELDS:
                      raise ValueError("Invalid catalog check fields")
                  identifier, state, source = check["id"], check["state"], check["source"]
                  if (not isinstance(identifier, str) or not ID_PATTERN.fullmatch(identifier) or identifier in seen
                      or not isinstance(state, str) or state not in STATES or source not in SOURCES
                      or (browser_ci and source != "browser")):
                      raise ValueError("Invalid catalog check")
                  seen.add(identifier)
                  checked, expires = parse_time(check["lastChecked"]), parse_time(check["expiresAt"])
                  expires_by = min(now, checked) if browser_ci else checked
                  if (not now - max_age <= checked <= now + timedelta(minutes=1)
                      or not now < expires <= expires_by + max_age or expires <= checked):
                      raise ValueError("Invalid catalog result lifetime")
                  groups.setdefault(source, {})[identifier] = [state, iso(checked), iso(expires)]
              return groups


          def record_catalog_hour(incoming, context):
              timestamps = {value[1] for value in incoming.values()}
              if len(timestamps) != 1:
                  raise ValueError("A browser report must have one observation time")
              checked = timestamps.pop()
              at = parse_time(checked)
              day = at.date()
              if at < mountain_midnight(day):
                  day -= timedelta(days=1)
              start = mountain_midnight(day)
              slots = (mountain_midnight(day + timedelta(days=1)) - start) // HOUR
              index = (at - start) // HOUR
              key = {"pk": "catalog", "sk": CATALOG_HISTORY_PREFIX + day.isoformat()}
              expires = int(mountain_midnight(day + MAX_AGE).timestamp())
              incoming_codes = {identifier: HISTORY_CODES[value[0]] for identifier, value in incoming.items()}
              empty = "-" * slots

              for _ in range(3):
                  if context.get_remaining_time_in_millis() < 6500:
                      raise TimeoutError("Catalog history write deadline reached")
                  try:
                      item = TABLE.get_item(Key=key, ConsistentRead=True).get("Item")
                  except BotoCoreError:
                      continue
                  except ClientError as error:
                      if error.response.get("Error", {}).get("Code") not in RETRYABLE_WRITES:
                          raise
                      continue
                  observed = list(item["observed"]) if item else [""] * slots
                  results = dict(item["results"]) if item else {}
                  if len(observed) != slots or len(results) > slots * MAX_CHECKS:
                      raise ValueError("Invalid catalog archive size")
                  if observed[index] >= checked:
                      return
                  for identifier in results.keys() | incoming_codes.keys():
                      previous = results.get(identifier, empty)
                      if len(previous) != slots:
                          raise ValueError("Invalid catalog history slots")
                      updated = previous[:index] + incoming_codes.get(identifier, "-") + previous[index + 1:]
                      if updated == empty:
                          results.pop(identifier, None)
                      else:
                          results[identifier] = updated
                  observed[index] = checked
                  if len(results) > slots * MAX_CHECKS:
                      raise ValueError("Catalog archive has too many results")
                  revision = item["rev"] if item else 0
                  request = {"ConditionExpression": "attribute_not_exists(pk)"}
                  if item:
                      request = {"ConditionExpression": "rev = :expected",
                                 "ExpressionAttributeValues": {":expected": revision}}
                  try:
                      TABLE.put_item(Item={**key, "rev": revision + 1, "results": results,
                                           "observed": observed, "expires": expires}, **request)
                      return
                  except BotoCoreError:
                      continue
                  except ClientError as error:
                      if error.response.get("Error", {}).get("Code") not in RETRYABLE_WRITES:
                          raise
              raise ValueError("Catalog history write contention")


          def record_source(source, incoming, now, context):
              key = {"pk": "catalog", "sk": source}
              now_iso = iso(now)
              for _ in range(3):
                  if context.get_remaining_time_in_millis() < 6500:
                      raise TimeoutError("Catalog report deadline reached")
                  item = TABLE.get_item(Key=key, ConsistentRead=True).get("Item")
                  original = (item or {}).get("results", {})
                  merged = {identifier: value for identifier, value in original.items() if value[2] > now_iso}
                  accepted = 0
                  for identifier, report in incoming.items():
                      current = merged.get(identifier)
                      if current == report:
                          accepted += 1
                      elif current is None or current[1] < report[1]:
                          merged[identifier] = report
                          accepted += 1
                  if len(merged) > MAX_CHECKS:
                      raise ValueError("Catalog source has too many unexpired entries")
                  if merged == original:
                      return accepted
                  revision = (item or {}).get("rev", 0)
                  request = {"ConditionExpression": "attribute_not_exists(pk)"}
                  if item:
                      request = {"ConditionExpression": "rev = :expected",
                                 "ExpressionAttributeValues": {":expected": revision}}
                  expires = max(int(parse_time(value[2]).timestamp()) for value in merged.values())
                  try:
                      TABLE.put_item(Item={**key, "rev": revision + 1, "results": merged, "expires": expires}, **request)
                      return accepted
                  except ClientError as error:
                      if error.response.get("Error", {}).get("Code") != "ConditionalCheckFailedException":
                          raise
              raise ValueError("Catalog report write contention")


          def handler(event, context):
              now = datetime.now(timezone.utc)
              try:
                  browser_ci = context.invoked_function_arn.endswith(":browser-ci")
                  groups = validate(event, now, browser_ci)
                  if browser_ci:
                      record_catalog_hour(groups["browser"], context)
                  accepted = sum(record_source(source, reports, now, context) for source, reports in groups.items())
                  return {"ok": True, "accepted": accepted}
              except (BotoCoreError, ClientError, KeyError, TypeError, ValueError, TimeoutError, OverflowError):
                  LOGGER.warning("AWS Status catalog report was not completed")
                  return {"ok": False, "error": "Status report was not accepted."}

  ReportInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: InOhio
    Properties:
      ManagedPolicyName: website-aws-status-report-invoke
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt Report.Arn

  WebsiteInvokerRole:
    Type: AWS::IAM::Role
    Condition: InOhio
    Properties:
      RoleName: website-aws-status-vercel
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/oidc.vercel.com/daniel-shorts-projects'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'oidc.vercel.com/daniel-shorts-projects:aud': sts.amazonaws.com
                'oidc.vercel.com/daniel-shorts-projects:sub': 'owner:daniel-shorts-projects:project:website:environment:production'
      Policies:
        - PolicyName: invoke-aws-status-collector
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Collector.Arn

Outputs:
  AwsStatusFunctionArn:
    Condition: InOhio
    Description: Production Vercel AWS_STATUS_FUNCTION_ARN
    Value: !GetAtt Collector.Arn
  AwsStatusAwsRoleArn:
    Condition: InOhio
    Description: Production Vercel AWS_STATUS_AWS_ROLE_ARN
    Value: !GetAtt WebsiteInvokerRole.Arn
  AwsStatusWriterFunctionArn:
    Condition: InOhio
    Value: !GetAtt Writer.Arn
  AwsStatusReportFunctionArn:
    Condition: InOhio
    Value: !GetAtt Report.Arn
  AwsStatusReportInvokePolicyArn:
    Condition: InOhio
    Value: !Ref ReportInvokePolicy
  AwsStatusHistoryTableName:
    Condition: InOhio
    Value: !Ref History
