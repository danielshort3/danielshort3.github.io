name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci (root)
        run: npm ci

      - name: npm ci (job tracker)
        run: npm ci
        working-directory: aws/job-application-tracker

      - name: npm ci (copilot extension)
        run: npm ci
        working-directory: browser-extension/job-application-copilot

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install Chromium for rendered smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test rendered desktop and mobile flows
        run: npm run test:browser
        timeout-minutes: 5
        env:
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/site-browser-smoke

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/site-browser-smoke
          if-no-files-found: ignore
