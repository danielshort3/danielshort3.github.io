name: Maintenance review snapshot

on:
  push:
    branches: [maintenance/repository-hardening-2026-09-20]
    paths: [.github/workflows/maintenance-review-snapshot.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package review sources without credentials or personal attachments
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/review-snapshot"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          excluded = {'.git', '.idea', '.codex-remote-attachments', '.playwright-mcp', '.mcp', '.opencode', 'archive', 'output', 'asset-sources', 'img', 'audio', 'documents', 'design'}
          metadata = []
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-snapshot'
          with tarfile.open(destination / 'review-source.tar.gz', 'w:gz') as tar:
              for name in paths:
                  if not name:
                      continue
                  path = pathlib.Path(name)
                  metadata.append({'path': name, 'size': path.stat().st_size})
                  if path.parts[0] not in excluded and not path.is_symlink():
                      tar.add(path, arcname=str(path), recursive=False)
              tar.add('node_modules', arcname='node_modules')
          (destination / 'tracked-files.json').write_text(json.dumps(metadata))
          (destination / 'source-sha.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-review-source
          path: ${{ runner.temp }}/review-snapshot/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
