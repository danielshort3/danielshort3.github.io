name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci (root)
        run: npm ci

      - name: npm ci (job tracker)
        run: npm ci
        working-directory: aws/job-application-tracker

      - name: npm ci (copilot extension)
        run: npm ci
        working-directory: browser-extension/job-application-copilot

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
