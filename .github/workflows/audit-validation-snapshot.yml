name: Audit validation snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/audit-validation-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve only the identified dependency patches
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact sharp@0.35.4
          npm update brace-expansion --package-lock-only --ignore-scripts --prefix aws/job-application-tracker
          npm update @xmldom/xmldom pdfjs-dist --package-lock-only --ignore-scripts --prefix browser-extension/job-application-copilot
          mkdir -p "$RUNNER_TEMP/audit-snapshot"
          git diff -- package.json package-lock.json aws/job-application-tracker/package-lock.json browser-extension/job-application-copilot/package-lock.json > "$RUNNER_TEMP/audit-snapshot/dependency-repair.patch"
          cp package.json "$RUNNER_TEMP/audit-snapshot/package.json"
          cp package-lock.json "$RUNNER_TEMP/audit-snapshot/package-lock.json"
          cp aws/job-application-tracker/package-lock.json "$RUNNER_TEMP/audit-snapshot/tracker-package-lock.json"
          cp browser-extension/job-application-copilot/package-lock.json "$RUNNER_TEMP/audit-snapshot/extension-package-lock.json"
          npm audit --json > "$RUNNER_TEMP/audit-snapshot/root-audit.json"
          npm audit --json --prefix aws/job-application-tracker > "$RUNNER_TEMP/audit-snapshot/tracker-audit.json"
          npm audit --json --prefix browser-extension/job-application-copilot > "$RUNNER_TEMP/audit-snapshot/extension-audit.json"
      - run: npm ci
      - run: npm ci --prefix browser-extension/job-application-copilot
      - run: npm run verify --prefix browser-extension/job-application-copilot
      - run: npm run build
      - name: Collect local browser assets without credentials or application data
        run: |
          for path in public/dist public/css public/js public/fonts public/pages public/projects public/img/ui public/img/brand public/img/projects public/index.html public/404.html public/portfolio.html public/tools.html public/games.html public/minesweeper-demo.html public/sw.js public/site.webmanifest; do
            if test -e "$path"; then printf '%s\n' "$path"; fi
          done > "$RUNNER_TEMP/audit-browser-paths.txt"
          tar -czf "$RUNNER_TEMP/audit-snapshot/browser-assets.tar.gz" -T "$RUNNER_TEMP/audit-browser-paths.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-snapshot/source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-validation-snapshot
          path: ${{ runner.temp }}/audit-snapshot/
          retention-days: 3
          if-no-files-found: error
