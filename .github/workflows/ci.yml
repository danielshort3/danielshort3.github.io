name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-security:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "aws/contact-function", "aws/job-application-tracker", "browser-extension/job-application-copilot"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install the locked dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: ${{ matrix.directory }}
      - name: Reject known dependency vulnerabilities
        run: npm audit --audit-level=low
        working-directory: ${{ matrix.directory }}

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci (root)
        run: npm ci

      - name: npm ci (contact Lambda)
        run: npm ci
        working-directory: aws/contact-function

      - name: npm ci (job tracker)
        run: npm ci
        working-directory: aws/job-application-tracker

      - name: npm ci (copilot extension)
        run: npm ci
        working-directory: browser-extension/job-application-copilot

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check delivery budgets and publish the performance report
        run: npm run performance:report

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-performance
          path: tmp/performance/
          if-no-files-found: ignore

      - name: Install pinned browsers for rendered smoke tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test rendered desktop and mobile flows
        run: npm run test:browser
        timeout-minutes: 12
        env:
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/site-browser-smoke

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/site-browser-smoke
          if-no-files-found: ignore

      - name: Verify stacked Guild scenes and taught actions
        run: npm run test:wayfarers-guild:stations:browser
        timeout-minutes: 8
        env:
          WAYFARERS_QA_DIR: ${{ runner.temp }}/wayfarers-stations

      - name: Upload Guild scene and tutorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfarers-stations
          path: |
            ${{ runner.temp }}/wayfarers-stations/*.png
            ${{ runner.temp }}/wayfarers-stations/report.json
          if-no-files-found: ignore

      - name: Verify fresh Guild play inside the website shell
        timeout-minutes: 4
        env:
          WAYFARERS_BASE_URL: http://127.0.0.1:4224
          WAYFARERS_QA_DIR: ${{ runner.temp }}/wayfarers-website
        run: |
          node build/dev.js --port 4224 --skip-build --no-watch > "$RUNNER_TEMP/guild-website-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node -e "(async()=>{for(let i=0;i<60;i++){try{if((await fetch(process.env.WAYFARERS_BASE_URL+'/games/wayfarers-guild')).ok)return;}catch{}await new Promise(r=>setTimeout(r,500));}throw Error('Guild preview did not start');})().catch(e=>{console.error(e);process.exit(1)});"
          node tests/games/wayfarers-guild-website.browser.cjs

      - name: Upload Guild website-shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfarers-website
          path: |
            ${{ runner.temp }}/wayfarers-website/*.png
            ${{ runner.temp }}/wayfarers-website/report.json
            ${{ runner.temp }}/guild-website-server.log
          if-no-files-found: ignore

  release-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned release browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser accessibility, interaction and reviewed screenshots
        run: npm run test:release
        timeout-minutes: 12
      - name: Existing frame routes and enlarged typography in all engines
        if: always()
        run: node tests/release/geometry.cjs
        timeout-minutes: 8
      - name: Recovery and consent regression checks
        if: always()
        run: npm run test:recovery
        timeout-minutes: 5
      - name: Upload release evidence, including screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality
          path: |
            tmp/release-results/
            tmp/release-report/
            tmp/release-geometry/
            tmp/quality/
          if-no-files-found: ignore

  mobile-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test Lighthouse regression comparison
        run: node --test tests/site/lighthouse-regression.test.cjs
      - name: Build reviewed Lighthouse reference
        run: |
          reference_sha="$(node -p "require('./tests/site/baselines/lighthouse.json').referenceCommit")"
          git fetch --no-tags --depth=1 origin "$reference_sha"
          git worktree add --detach "$RUNNER_TEMP/lighthouse-reference" "$reference_sha"
          npm --prefix "$RUNNER_TEMP/lighthouse-reference" ci
          npm --prefix "$RUNNER_TEMP/lighthouse-reference" run build
      - run: npx playwright install --with-deps chromium
      - name: Three paired mobile Lighthouse runs per route
        run: npm run performance:lab -- --reference-dir "$RUNNER_TEMP/lighthouse-reference"
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-lighthouse
          path: tmp/quality/lighthouse/
          if-no-files-found: ignore
