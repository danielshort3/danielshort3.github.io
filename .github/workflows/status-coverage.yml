name: Status coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/tools/aws-status.test.js
      - run: npx playwright install --with-deps chromium
      - name: Check catalog workflows with offline fixtures
        run: node tests/status-coverage/run.cjs --site-root "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/status-coverage.json"
