<div id="__REVIEW_ID__">
  <style>
    #__REVIEW_ID__ .action-comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
    #__REVIEW_ID__ .action-view { min-width: 0; }
    #__REVIEW_ID__ .action-label { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
    #__REVIEW_ID__ .action-canvas { display: block; width: 100%; aspect-ratio: 32 / 25; }
    #__REVIEW_ID__ .action-timeline { margin-top: 16px; }
    #__REVIEW_ID__ .action-palette { position: absolute; visibility: hidden; pointer-events: none; }
    @media (max-width: 560px) {
      #__REVIEW_ID__ .action-comparison { grid-template-columns: 1fr; }
    }
  </style>
  <h3 data-title>Animation study</h3>
  <div class="viz-controls">
    <label class="form-label">Speed
      <select class="form-select" data-speed>
        <option value="0.5">Half speed</option>
        <option value="1" selected>Normal</option>
      </select>
    </label>
    <label class="form-label">Size
      <select class="form-select" data-size>
        <option value="1">Game size</option>
        <option value="2" selected>2× game size</option>
      </select>
    </label>
    <label class="form-label" data-background-field>Background
      <select class="form-select" data-background>
        <option value="neutral">Neutral</option>
        <option value="town">Current town</option>
      </select>
    </label>
  </div>
  <div class="action-comparison">
    <section class="action-view" aria-labelledby="__REVIEW_ID__-before-label">
      <div class="action-label"><span id="__REVIEW_ID__-before-label" data-before-label>Current</span><span class="text-small tabular-nums" data-before-frame></span></div>
      <canvas class="action-canvas" data-before role="img" aria-label="Current animation">Current animation</canvas>
    </section>
    <section class="action-view" aria-labelledby="__REVIEW_ID__-after-label">
      <div class="action-label"><span id="__REVIEW_ID__-after-label" data-after-label>New study</span><span class="text-small tabular-nums" data-after-frame></span></div>
      <canvas class="action-canvas" data-after role="img" aria-label="New animation study">New animation study</canvas>
    </section>
  </div>
  <div class="viz-row">
    <button class="btn btn-primary" type="button" data-play>Pause</button>
    <button class="btn" type="button" data-step>Next frame</button>
    <span class="text-small" data-phase-name></span>
  </div>
  <label class="form-label action-timeline">Loop position <span class="tabular-nums" data-position>0%</span>
    <input class="form-range" type="range" min="0" max="1000" value="0" data-seek aria-label="Animation loop position">
  </label>
  <span class="sr-only" data-status aria-live="polite"></span>
  <span class="action-palette" aria-hidden="true" data-palette></span>
  <script type="application/json" data-review-data>__REVIEW_DATA__</script>
  <script>
    (() => {
      'use strict';
      // Builder replaces __REVIEW_ID__ with data.id and __REVIEW_DATA__ with JSON.
      // Escape '<' as '\u003c' in JSON before insertion. All times are milliseconds.
      // DATA: {id,title,images:{key:dataURI},scene?:{width,height,groundY,actorX},
      // durationMs?,defaults?:{speed,size,playing,background},background?:{image},before:Clip,after:Clip}.
      // Clip: {label,image,scale,durationMs,holdsMs:number[],frames:Frame[],
      // offsetX?,offsetY?,rootMotion?:[{timeMs,x,y,easing?:'linear'|'smooth'|'hold'}],
      // phases?:[{startMs,endMs,label}],effects?:Effect[],dangerLane?:Lane}.
      // Frame: {x,y,w,h,rootX,rootY,image?,phase?,visible?:{left,top,right,bottom}}.
      // rootX/Y and visible bounds are local SOURCE pixels. Scale is shared by all
      // frames in that clip. Offsets, rootMotion and lane dimensions are GAME pixels.
      // holdsMs sum to durationMs; each panel repeats at its own unmodified duration.
      // Effect: same image/scale/frames/holdsMs contract, plus startMs,durationMs,
      // offsetX/Y,layer?:'behind'|'front',followRoot?:boolean,fadeInMs?,fadeOutMs?,opacity?.
      // Lane: {startMs?:0,tellMs?:750,lockMs?:200,chargeMs?:550,recoverMs?:350,
      // x?:actorX,y?:groundY,length?:140,height?:18,direction?:1,color?:'#f17c72'}.
      // Lane stays at its initial world position; final lockMs of tell are fully locked.
      // API: window.starfallActionReviews[id].snapshot() returns a detached frozen
      // snapshot. .seek(ms) pauses at exact timeline time without saving host state.
      // Ready: root.dataset.ready='true'; window event 'starfall-review-ready', {id}.
      const root = document.getElementById('__REVIEW_ID__');
      const find = (name) => root.querySelector(`[data-${name}]`);
      const controls = Object.fromEntries(['speed', 'size', 'background', 'background-field', 'play', 'step', 'seek', 'position', 'phase-name', 'status', 'palette'].map((name) => [name, find(name)]));
      const canvases = [find('before'), find('after')];
      const frameLabels = [find('before-frame'), find('after-frame')];
      const data = JSON.parse(find('review-data').textContent);
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const scene = { width: 320, height: 250, groundY: 220, actorX: 160, ...data.scene };
      const clips = [data.before, data.after];
      const images = {};
      const timings = new WeakMap();
      const mod = (value, divisor) => ((value % divisor) + divisor) % divisor;
      const finite = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      let loaded = false;
      let visible = true;
      let elapsedMs = 0;
      let lastTick = 0;
      let animationRequest = 0;
      let colors = {};
      let panelSnapshots = [];
      let timelineDuration = 1;
      const defaults = {
        speed: data.defaults && data.defaults.speed === 0.5 ? 0.5 : 1,
        size: data.defaults && data.defaults.size === 1 ? 1 : 2,
        playing: !reducedMotion.matches && !(data.defaults && data.defaults.playing === false),
        background: data.background && data.defaults && data.defaults.background === 'town' ? 'town' : 'neutral'
      };
      let state = { ...defaults };

      function makeTiming(clip) {
        if (!clip || !Array.isArray(clip.frames) || !clip.frames.length) throw new Error('Missing animation frames.');
        if (!(finite(clip.scale) > 0)) throw new Error('Invalid animation scale.');
        if (!Array.isArray(clip.holdsMs) || clip.holdsMs.length !== clip.frames.length || clip.holdsMs.some((hold) => !Number.isFinite(hold) || hold <= 0)) throw new Error('Invalid frame timing.');
        let duration = 0;
        const starts = clip.holdsMs.map((hold) => { const start = duration; duration += hold; return start; });
        if (!(finite(clip.durationMs) > 0) || Math.abs(duration - clip.durationMs) > 0.1) throw new Error('Frame holds must sum to the clip duration.');
        clip.frames.forEach((frame) => {
          if (!['x', 'y', 'w', 'h', 'rootX', 'rootY'].every((key) => Number.isFinite(frame[key])) || frame.w <= 0 || frame.h <= 0 || frame.x < 0 || frame.y < 0) throw new Error('Invalid source frame.');
        });
        const timing = { starts, duration: clip.durationMs };
        timings.set(clip, timing);
        return timing;
      }

      function frameAt(clip, timeMs, looping = true) {
        const timing = timings.get(clip);
        const time = looping ? mod(timeMs, timing.duration) : clamp(timeMs, 0, timing.duration);
        for (let i = timing.starts.length - 1; i >= 0; i -= 1) if (time + 1e-7 >= timing.starts[i]) return i;
        return 0;
      }

      function rootMotionAt(clip, timeMs) {
        const points = clip.rootMotion;
        if (!Array.isArray(points) || !points.length) return { x: 0, y: 0 };
        if (timeMs <= points[0].timeMs) return { x: finite(points[0].x), y: finite(points[0].y) };
        for (let i = 1; i < points.length; i += 1) {
          const a = points[i - 1];
          const b = points[i];
          if (timeMs <= b.timeMs) {
            let phase = clamp((timeMs - a.timeMs) / Math.max(0.0001, b.timeMs - a.timeMs), 0, 1);
            if (a.easing === 'hold') phase = phase === 1 ? 1 : 0;
            if (a.easing === 'smooth') phase = phase * phase * (3 - 2 * phase);
            return { x: finite(a.x) + (finite(b.x) - finite(a.x)) * phase, y: finite(a.y) + (finite(b.y) - finite(a.y)) * phase };
          }
        }
        return { x: finite(points[points.length - 1].x), y: finite(points[points.length - 1].y) };
      }

      function phaseAt(clip, timeMs, index) {
        const phase = (clip.phases || []).find((item) => timeMs >= item.startMs && timeMs < item.endMs);
        if (phase) return String(phase.label);
        return String(clip.frames[index].phase || `Frame ${index + 1}`);
      }

      function syncControls() {
        controls.speed.value = String(state.speed);
        controls.size.value = String(state.size);
        controls.background.value = state.background;
        controls.play.textContent = state.playing ? 'Pause' : 'Play';
        controls.play.setAttribute('aria-label', state.playing ? 'Pause both animations' : 'Play both animations');
        controls.play.setAttribute('aria-pressed', String(state.playing));
      }

      function save() {
        if (!window.openai || typeof window.openai.setWidgetState !== 'function') return;
        window.openai.setWidgetState({
          modelContent: { reviewId: data.id, speed: state.speed, selectedFrame: state.playing ? null : frameAt(data.after, elapsedMs), phase: state.playing ? null : phaseAt(data.after, mod(elapsedMs, data.after.durationMs), frameAt(data.after, elapsedMs)) },
          privateContent: { reviewId: data.id, size: state.size, background: state.background, playing: state.playing, elapsedMs: mod(elapsedMs, timelineDuration) }
        }).catch(() => {});
      }

      function applySaved(saved) {
        const model = saved && saved.modelContent || {};
        const ui = saved && saved.privateContent || {};
        state = { ...defaults };
        elapsedMs = 0;
        if (model.reviewId === data.id && [0.5, 1].includes(model.speed)) state.speed = model.speed;
        if (ui.reviewId === data.id) {
          if ([1, 2].includes(ui.size)) state.size = ui.size;
          if (['neutral', 'town'].includes(ui.background) && (ui.background !== 'town' || data.background)) state.background = ui.background;
          if (typeof ui.playing === 'boolean') state.playing = ui.playing;
          if (Number.isFinite(ui.elapsedMs) && ui.elapsedMs >= 0) elapsedMs = ui.elapsedMs;
        } else if (model.reviewId === data.id && Number.isInteger(model.selectedFrame) && model.selectedFrame >= 0 && model.selectedFrame < data.after.frames.length) {
          elapsedMs = timings.get(data.after).starts[model.selectedFrame];
          state.playing = false;
        }
        lastTick = 0;
        syncControls();
        draw();
        schedule();
      }

      function resolveColor(name) {
        controls.palette.style.color = `var(--${name})`;
        return getComputedStyle(controls.palette).color;
      }

      function updateColors() {
        colors = { background: resolveColor('background'), ground: resolveColor('muted'), line: resolveColor('border') };
        draw();
      }

      function spriteBounds(frame, scale, x, y) {
        const box = frame.visible || { left: 0, top: 0, right: frame.w, bottom: frame.h };
        return { left: x + (box.left - frame.rootX) * scale, top: y + (box.top - frame.rootY) * scale, right: x + (box.right - frame.rootX) * scale, bottom: y + (box.bottom - frame.rootY) * scale };
      }

      function drawSprite(ctx, clip, index, x, y, zoom) {
        const frame = clip.frames[index];
        const scale = clip.scale * zoom;
        ctx.drawImage(images[frame.image || clip.image], frame.x, frame.y, frame.w, frame.h, x - frame.rootX * scale, y - frame.rootY * scale, frame.w * scale, frame.h * scale);
        return spriteBounds(frame, scale, x, y);
      }

      function drawBackground(ctx) {
        ctx.fillStyle = colors.background;
        ctx.fillRect(0, 0, scene.width, scene.height);
        if (state.background === 'town' && data.background && images[data.background.image]) {
          const image = images[data.background.image];
          const scale = Math.max(scene.width / image.width, scene.height / image.height);
          ctx.drawImage(image, (scene.width - image.width * scale) / 2, (scene.height - image.height * scale) / 2, image.width * scale, image.height * scale);
        } else {
          ctx.fillStyle = colors.ground;
          ctx.fillRect(0, scene.groundY, scene.width, scene.height - scene.groundY);
          ctx.strokeStyle = colors.line;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, scene.groundY + 0.5);
          ctx.lineTo(scene.width, scene.groundY + 0.5);
          ctx.stroke();
        }
      }

      function drawLane(ctx, clip, timeMs, zoom) {
        const lane = clip.dangerLane;
        if (!lane) return null;
        const time = timeMs - finite(lane.startMs);
        const tell = finite(lane.tellMs, 750);
        const lock = clamp(finite(lane.lockMs, 200), 0, tell);
        const charge = finite(lane.chargeMs, 550);
        const recover = finite(lane.recoverMs, 350);
        if (time < 0 || time >= tell + charge + recover) return null;
        const phase = time < tell - lock ? 'Wind-up' : time < tell ? 'Locked' : time < tell + charge ? 'Charge' : 'Recover';
        const opacity = phase === 'Wind-up' ? 0.18 + 0.16 * (time / Math.max(1, tell - lock)) : phase === 'Locked' ? 0.52 : phase === 'Charge' ? 0.38 : 0.22 * (1 - (time - tell - charge) / Math.max(1, recover));
        const x = scene.actorX + (finite(lane.x, scene.actorX) - scene.actorX) * zoom;
        const y = scene.groundY + (finite(lane.y, scene.groundY) - scene.groundY) * zoom;
        const length = Math.max(1, finite(lane.length, 140)) * zoom;
        const height = Math.max(1, finite(lane.height, 18)) * zoom;
        const direction = lane.direction === -1 ? -1 : 1;
        const tip = Math.min(height, length / 3);
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(direction, 1);
        ctx.globalAlpha = opacity;
        ctx.fillStyle = lane.color || '#f17c72';
        ctx.beginPath();
        ctx.moveTo(0, -height / 2);
        ctx.lineTo(length - tip, -height / 2);
        ctx.lineTo(length, 0);
        ctx.lineTo(length - tip, height / 2);
        ctx.lineTo(0, height / 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        return { phase, locked: time >= tell - lock, opacity, bounds: { left: Math.min(x, x + length * direction), top: y - height / 2, right: Math.max(x, x + length * direction), bottom: y + height / 2 } };
      }

      function paint(canvas, clip) {
        const width = Math.max(1, canvas.clientWidth);
        const ratio = clamp(window.devicePixelRatio || 1, 1, 2);
        const targetWidth = Math.round(width * ratio);
        const targetHeight = Math.round(width * scene.height / scene.width * ratio);
        if (canvas.width !== targetWidth || canvas.height !== targetHeight) { canvas.width = targetWidth; canvas.height = targetHeight; }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(targetWidth / scene.width, 0, 0, targetHeight / scene.height, 0, 0);
        ctx.clearRect(0, 0, scene.width, scene.height);
        ctx.imageSmoothingEnabled = false;
        drawBackground(ctx);
        const timeMs = mod(elapsedMs, clip.durationMs);
        const index = frameAt(clip, timeMs);
        const motion = rootMotionAt(clip, timeMs);
        const zoom = state.size;
        const x = scene.actorX + (finite(clip.offsetX) + motion.x) * zoom;
        const y = scene.groundY + (finite(clip.offsetY) + motion.y) * zoom;
        const lane = drawLane(ctx, clip, timeMs, zoom);
        const effects = (clip.effects || []).map((effect) => {
          const localTime = timeMs - finite(effect.startMs);
          if (localTime < 0 || localTime >= effect.durationMs) return null;
          const fadeIn = finite(effect.fadeInMs);
          const fadeOut = finite(effect.fadeOutMs);
          const opacity = clamp(finite(effect.opacity, 1), 0, 1) * (fadeIn > 0 ? Math.min(1, localTime / fadeIn) : 1) * (fadeOut > 0 ? Math.min(1, (effect.durationMs - localTime) / fadeOut) : 1);
          const effectX = (effect.followRoot === false ? scene.actorX : x) + finite(effect.offsetX) * zoom;
          const effectY = (effect.followRoot === false ? scene.groundY : y) + finite(effect.offsetY) * zoom;
          return { effect, frame: frameAt(effect, localTime, false), opacity, x: effectX, y: effectY, bounds: null };
        });
        const paintEffects = (front) => effects.forEach((sample) => {
          if (!sample || (sample.effect.layer === 'front') !== front) return;
          ctx.globalAlpha = sample.opacity;
          sample.bounds = drawSprite(ctx, sample.effect, sample.frame, sample.x, sample.y, zoom);
          ctx.globalAlpha = 1;
        });
        paintEffects(false);
        const bounds = drawSprite(ctx, clip, index, x, y, zoom);
        paintEffects(true);
        const result = { frame: index, frameCount: clip.frames.length, timeMs, durationMs: clip.durationMs, phase: phaseAt(clip, timeMs, index), root: { x, y }, rootMotion: motion, scale: clip.scale * zoom, bounds, lane, effects: effects.map((sample) => sample ? { frame: sample.frame, opacity: sample.opacity, bounds: sample.bounds } : null) };
        canvas.dataset.frame = String(index);
        canvas.dataset.bounds = JSON.stringify(bounds);
        canvas.dataset.sampleTimeMs = String(timeMs);
        return result;
      }

      function draw() {
        if (!loaded) return;
        panelSnapshots = clips.map((clip, index) => paint(canvases[index], clip));
        panelSnapshots.forEach((panel, index) => { frameLabels[index].textContent = `${panel.frame + 1} / ${panel.frameCount}`; });
        controls['phase-name'].textContent = panelSnapshots[1].phase;
        const position = mod(elapsedMs, timelineDuration) / timelineDuration;
        controls.seek.value = String(Math.floor(position * 1000));
        controls.seek.setAttribute('aria-valuetext', `${Math.round(position * 100)} percent, ${panelSnapshots[1].phase}, frame ${panelSnapshots[1].frame + 1}`);
        controls.position.textContent = `${Math.round(position * 100)}%`;
        root.dataset.elapsedMs = String(elapsedMs);
      }

      function schedule() {
        if (animationRequest) cancelAnimationFrame(animationRequest);
        animationRequest = 0;
        if (!loaded || !state.playing || document.hidden || !visible || !root.isConnected) { lastTick = 0; return; }
        animationRequest = requestAnimationFrame(tick);
      }

      function tick(now) {
        animationRequest = 0;
        if (!loaded || !state.playing || document.hidden || !visible || !root.isConnected) { lastTick = 0; return; }
        if (lastTick) elapsedMs += Math.max(0, now - lastTick) * state.speed;
        lastTick = now;
        draw();
        animationRequest = requestAnimationFrame(tick);
      }

      function changed(announce = false, persist = true) {
        lastTick = 0;
        syncControls();
        draw();
        schedule();
        if (announce && loaded) controls.status.textContent = `${state.playing ? 'Playing' : 'Paused'}. ${panelSnapshots[1].phase}.`;
        if (persist) save();
      }

      function snapshot() {
        const value = JSON.parse(JSON.stringify({ id: data.id, ready: loaded, elapsedMs, durationMs: timelineDuration, state, scene, before: panelSnapshots[0] || null, after: panelSnapshots[1] || null }));
        const freeze = (item) => { if (item && typeof item === 'object') { Object.values(item).forEach(freeze); Object.freeze(item); } return item; };
        return freeze(value);
      }

      function fail(error) {
        state.playing = false;
        loaded = false;
        root.dataset.ready = 'error';
        syncControls();
        schedule();
        [controls.play, controls.step, controls.seek].forEach((control) => { control.disabled = true; });
        controls.status.classList.remove('sr-only');
        controls.status.setAttribute('role', 'alert');
        controls.status.textContent = 'This animation could not load.';
        root.dataset.error = error && error.message || 'Image load failed.';
        window.dispatchEvent(new CustomEvent('starfall-review-error', { detail: { id: data.id, message: root.dataset.error } }));
      }

      try {
        if (!/^[a-z][a-z0-9-]*$/.test(data.id) || root.id !== data.id) throw new Error('Review ID must match the root ID.');
        clips.forEach((clip) => { makeTiming(clip); (clip.effects || []).forEach(makeTiming); });
        timelineDuration = finite(data.durationMs, data.after.durationMs);
        if (timelineDuration <= 0) throw new Error('Invalid review duration.');
        find('title').textContent = String(data.title || 'Animation study');
        clips.forEach((clip, index) => {
          const label = String(clip.label || (index ? 'New study' : 'Current'));
          find(index ? 'after-label' : 'before-label').textContent = label;
          canvases[index].setAttribute('aria-label', label);
          canvases[index].style.aspectRatio = `${scene.width} / ${scene.height}`;
        });
        controls['background-field'].hidden = !data.background;
        controls.speed.addEventListener('change', () => { state.speed = Number(controls.speed.value); changed(); });
        controls.size.addEventListener('change', () => { state.size = Number(controls.size.value); changed(); });
        controls.background.addEventListener('change', () => { state.background = controls.background.value; changed(); });
        controls.play.addEventListener('click', () => { state.playing = !state.playing; changed(true); });
        controls.step.addEventListener('click', () => {
          state.playing = false;
          const next = (frameAt(data.after, elapsedMs) + 1) % data.after.frames.length;
          elapsedMs = timings.get(data.after).starts[next];
          changed(true);
        });
        controls.seek.addEventListener('input', () => {
          state.playing = false;
          elapsedMs = Math.min(Number(controls.seek.value) / 1000 * timelineDuration, timelineDuration - 0.0001);
          changed(false, false);
        });
        controls.seek.addEventListener('change', () => changed(true));
        window.addEventListener('openai:set_globals', (event) => {
          const globals = event.detail && event.detail.globals;
          if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) applySaved(globals.widgetState);
        });
        document.addEventListener('visibilitychange', schedule);
        reducedMotion.addEventListener('change', (event) => { if (event.matches) { state.playing = false; changed(false, false); } });
        new ResizeObserver(draw).observe(root);
        new MutationObserver(updateColors).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
        if (typeof IntersectionObserver === 'function') new IntersectionObserver((entries) => { visible = entries[0].isIntersecting; schedule(); }).observe(root);
        window.starfallActionReviews = window.starfallActionReviews || {};
        window.starfallActionReviews[data.id] = Object.freeze({ snapshot, seek: (timeMs) => { if (!Number.isFinite(timeMs) || timeMs < 0) throw new TypeError('seek requires nonnegative milliseconds.'); elapsedMs = timeMs; state.playing = false; changed(false, false); return snapshot(); } });
        applySaved(window.openai && window.openai.widgetState);
        updateColors();
        Promise.all(Object.entries(data.images || {}).map(([id, src]) => new Promise((resolve, reject) => {
          if (typeof src !== 'string' || !src.startsWith('data:image/')) { reject(new Error('Images must use embedded data URIs.')); return; }
          const image = new Image();
          image.onload = () => { images[id] = image; resolve(); };
          image.onerror = () => reject(new Error(`Image could not load: ${id}`));
          image.src = src;
        }))).then(() => {
          clips.forEach((clip) => [clip, ...(clip.effects || [])].forEach((layer) => layer.frames.forEach((frame) => {
            const image = images[frame.image || layer.image];
            if (!image || frame.x + frame.w > image.width || frame.y + frame.h > image.height) throw new Error('Source frame exceeds its image.');
          })));
          if (data.background && !images[data.background.image]) throw new Error('Missing town background.');
          loaded = true;
          root.dataset.ready = 'true';
          draw();
          schedule();
          window.dispatchEvent(new CustomEvent('starfall-review-ready', { detail: { id: data.id } }));
        }).catch(fail);
      } catch (error) { fail(error); }
    })();
  </script>
</div>
