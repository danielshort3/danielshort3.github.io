name: Audit repair evidence
on:
  push:
    branches: [fix/technical-audit-hardening]
    paths: ['.github/workflows/audit-repair-evidence.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate targeted dependency repairs with npm
        run: |
          mkdir -p "$RUNNER_TEMP/audit-repair"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-repair/source-sha.txt"
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact sharp@0.35.4
          npm update brace-expansion --package-lock-only --ignore-scripts --prefix aws/job-application-tracker
          npm update @xmldom/xmldom pdfjs-dist --package-lock-only --ignore-scripts --prefix browser-extension/job-application-copilot
          git diff --binary -- package.json package-lock.json aws/job-application-tracker/package-lock.json browser-extension/job-application-copilot/package-lock.json > "$RUNNER_TEMP/audit-repair/dependency-repair.patch"
          git hash-object package-lock.json aws/job-application-tracker/package-lock.json browser-extension/job-application-copilot/package-lock.json | tee "$RUNNER_TEMP/audit-repair/lockfile-hashes.txt"
          npm audit --json > "$RUNNER_TEMP/audit-repair/root-audit.json"
          npm audit --json --prefix aws/job-application-tracker > "$RUNNER_TEMP/audit-repair/tracker-audit.json"
          npm audit --json --prefix browser-extension/job-application-copilot > "$RUNNER_TEMP/audit-repair/extension-audit.json"
      - run: npm ci && npm ci --prefix aws/job-application-tracker && npm ci --prefix browser-extension/job-application-copilot
      - run: npm run build
      - name: Run backend regressions
        run: node --test tests/tools/cognito-jwt-rotation.test.js tests/tools/chatbot-request-boundaries.test.js
      - name: Capture source and representative browser assets
        if: always()
        run: |
          git ls-files -z > "$RUNNER_TEMP/audit-repair/tracked-paths.bin"
          git diff --binary > "$RUNNER_TEMP/audit-repair/working.patch"
          python3 - <<'PY'
          import os, pathlib, subprocess, tarfile
          root = pathlib.Path('.')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          paths = {pathlib.Path(p) for p in tracked if p}
          paths.update(p for p in pathlib.Path('public').rglob('*') if p.is_file())
          text = {'.js', '.cjs', '.mjs', '.json', '.html', '.css', '.md', '.yml', '.yaml', '.py', '.txt', '.svg', '.xml', '.webmanifest', '.csv', '.ts', '.tsx'}
          images = {'.png', '.jpg', '.jpeg', '.avif', '.webp', '.woff', '.woff2'}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-repair/source-and-browser.tar.gz'
          selected = []
          with tarfile.open(output, 'w:gz') as archive:
              for p in sorted(paths):
                  if not p.is_file() or p.is_symlink(): continue
                  if any(part in {'node_modules', '.git', 'asset-sources', 'mobile', 'documents', 'pdf', 'archive', 'archives'} for part in p.parts): continue
                  if p.suffix.lower() in text or (p.suffix.lower() in images and p.stat().st_size < 500000):
                      archive.add(p, arcname=str(p), recursive=False)
                      selected.append(str(p))
          (output.parent / 'included-paths.txt').write_text('\n'.join(selected))
          print(f'Captured {len(selected)} files; archive is {output.stat().st_size} bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-repair-evidence
          path: ${{ runner.temp }}/audit-repair/
          retention-days: 3
          if-no-files-found: error
